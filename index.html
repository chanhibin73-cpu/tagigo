<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シス単多義語テスト</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* テーマ変数の基本設定 */
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: #eff6ff;
            --primary-ring: rgba(59, 130, 246, 0.5);
        }
        
        .theme-blue {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: #eff6ff;
            --primary-ring: rgba(59, 130, 246, 0.5);
        }
        .theme-emerald {
            --primary-color: #10b981;
            --primary-hover: #059669;
            --primary-light: #ecfdf5;
            --primary-ring: rgba(16, 185, 129, 0.5);
        }
        .theme-purple {
            --primary-color: #8b5cf6;
            --primary-hover: #7c3aed;
            --primary-light: #f5f3ff;
            --primary-ring: rgba(139, 92, 246, 0.5);
        }
        .theme-rose {
            --primary-color: #f43f5e;
            --primary-hover: #e11d48;
            --primary-light: #fff1f2;
            --primary-ring: rgba(244, 63, 94, 0.5);
        }

        .bg-primary { background-color: var(--primary-color); }
        .bg-primary-hover:hover { background-color: var(--primary-hover); }
        .bg-primary-light { background-color: var(--primary-light); }
        .text-primary { color: var(--primary-color); }
        .border-primary { border-color: var(--primary-color); }
        .focus-ring:focus { outline: none; box-shadow: 0 0 0 3px var(--primary-ring); }

        /* フォントファミリー設定 */
        .font-sans-custom { font-family: 'Inter', sans-serif; }
        .font-serif-custom { font-family: 'Noto Serif JP', serif; }
        .font-mono-custom { font-family: 'Roboto Mono', monospace; }

        /* トランジション */
        .view-transition {
            transition: all 0.25s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans-custom min-h-screen flex flex-col items-center justify-start p-3 sm:p-6 transition-colors duration-200">

    <!-- アプリコンテナ -->
    <div id="app-container" class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 flex flex-col min-h-[600px] text-base">
        
        <!-- ヘッダー -->
        <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-sm">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('menu')">
                <i class="fa-solid fa-graduation-cap text-2xl text-amber-400"></i>
                <h1 class="font-bold text-lg sm:text-xl tracking-wide">シス単多義語テスト</h1>
            </div>
            <div id="header-word-count" class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-300 border border-slate-700">
                登録単語: <span id="total-words-badge" class="font-bold text-amber-400">0</span>語
            </div>
        </header>

        <!-- メインコンテンツ領域 -->
        <main class="flex-1 p-4 sm:p-6 flex flex-col relative overflow-y-auto">

            <!-- 1. メインメニュー画面 -->
            <section id="view-menu" class="view-screen flex flex-col justify-center flex-1 space-y-4 my-auto py-4">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-800 mb-1">メインメニュー</h2>
                    <p class="text-slate-500 text-sm">学習の形式を選択してください</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- テストをする -->
                    <button onclick="switchView('test-setup')" class="group relative bg-white p-6 rounded-xl border-2 border-slate-100 shadow-sm hover:border-slate-300 hover:shadow-md transition-all flex flex-col items-center text-center space-y-3">
                        <div class="w-14 h-14 bg-primary-light text-primary rounded-full flex items-center justify-center text-2xl transition-transform group-hover:scale-110">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">テストをする</h3>
                            <p class="text-xs text-slate-500 mt-1">3つの形式からテストに挑戦</p>
                        </div>
                    </button>

                    <!-- 単語を確認する -->
                    <button onclick="switchView('word-list')" class="group relative bg-white p-6 rounded-xl border-2 border-slate-100 shadow-sm hover:border-slate-300 hover:shadow-md transition-all flex flex-col items-center text-center space-y-3">
                        <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center text-2xl transition-transform group-hover:scale-110">
                            <i class="fa-solid fa-book-open"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">単語を確認する</h3>
                            <p class="text-xs text-slate-500 mt-1">全単語一覧と意味のチェック</p>
                        </div>
                    </button>

                    <!-- 履歴 -->
                    <button onclick="switchView('history')" class="group relative bg-white p-6 rounded-xl border-2 border-slate-100 shadow-sm hover:border-slate-300 hover:shadow-md transition-all flex flex-col items-center text-center space-y-3">
                        <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-2xl transition-transform group-hover:scale-110">
                            <i class="fa-solid fa-chart-line"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">学習履歴</h3>
                            <p class="text-xs text-slate-500 mt-1">直近10回の結果・詳細を確認</p>
                        </div>
                    </button>

                    <!-- 設定 -->
                    <button onclick="switchView('settings')" class="group relative bg-white p-6 rounded-xl border-2 border-slate-100 shadow-sm hover:border-slate-300 hover:shadow-md transition-all flex flex-col items-center text-center space-y-3">
                        <div class="w-14 h-14 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center text-2xl transition-transform group-hover:scale-110">
                            <i class="fa-solid fa-gear"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">設定</h3>
                            <p class="text-xs text-slate-500 mt-1">テーマ色・文字サイズ・削除</p>
                        </div>
                    </button>
                </div>
            </section>

            <!-- 2. テスト設定（条件指定）画面 -->
            <section id="view-test-setup" class="view-screen hidden space-y-6">
                <div class="flex items-center space-x-3 border-b border-slate-200 pb-3">
                    <button onclick="switchView('menu')" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100">
                        <i class="fa-solid fa-arrow-left text-lg"></i>
                    </button>
                    <h2 class="text-xl font-bold text-slate-800">テストの設定</h2>
                </div>

                <!-- テスト形式選択 -->
                <div class="space-y-3">
                    <label class="block font-bold text-slate-700 text-sm">1. テスト形式の選択</label>
                    <div class="grid grid-cols-1 gap-3">
                        <label class="test-mode-option flex items-center p-3 sm:p-4 rounded-xl border-2 border-slate-200 cursor-pointer hover:bg-slate-50 transition-all">
                            <input type="radio" name="testMode" value="en-to-jp" checked class="w-5 h-5 text-primary">
                            <div class="ml-3">
                                <span class="font-bold block text-slate-800">英単語を見て四択で日本語を選ぶ</span>
                                <span class="text-xs text-slate-500">単語の意味を素早く把握する練習</span>
                            </div>
                        </label>
                        <label class="test-mode-option flex items-center p-3 sm:p-4 rounded-xl border-2 border-slate-200 cursor-pointer hover:bg-slate-50 transition-all">
                            <input type="radio" name="testMode" value="jp-to-en" class="w-5 h-5 text-primary">
                            <div class="ml-3">
                                <span class="font-bold block text-slate-800">日本語(+例文)を見て四択で英単語を選ぶ</span>
                                <span class="text-xs text-slate-500">文脈から適切な英単語を選ぶ練習</span>
                            </div>
                        </label>
                        <label class="test-mode-option flex items-center p-3 sm:p-4 rounded-xl border-2 border-slate-200 cursor-pointer hover:bg-slate-50 transition-all">
                            <input type="radio" name="testMode" value="typing" class="w-5 h-5 text-primary">
                            <div class="ml-3">
                                <span class="font-bold block text-slate-800">日本語(+例文)を見て英単語を書く (スペル入力)</span>
                                <span class="text-xs text-slate-500">正確な綴りを記述するアウトプット練習</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 出題範囲指定 -->
                <div class="space-y-3">
                    <label class="block font-bold text-slate-700 text-sm">2. 出題範囲の指定 (単語番号)</label>
                    <div class="flex items-center space-x-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div class="flex-1">
                            <label class="text-xs text-slate-500 block mb-1">開始番号</label>
                            <input type="number" id="range-start" min="1" value="1" class="w-full p-2 rounded-lg border border-slate-300 focus-ring font-semibold text-center">
                        </div>
                        <span class="text-slate-400 font-bold mt-5">〜</span>
                        <div class="flex-1">
                            <label class="text-xs text-slate-500 block mb-1">終了番号</label>
                            <input type="number" id="range-end" min="1" value="185" class="w-full p-2 rounded-lg border border-slate-300 focus-ring font-semibold text-center">
                        </div>
                    </div>
                    <p class="text-xs text-slate-400">※ 登録単語数: <span id="max-word-info">0</span>件（各単語の意味・用法ごとに個別に問題が出題されます）</p>
                </div>

                <!-- 出題問題数 -->
                <div class="space-y-3">
                    <label class="block font-bold text-slate-700 text-sm">3. 出題数</label>
                    <select id="test-count-select" class="w-full p-3 rounded-xl border border-slate-300 focus-ring bg-white font-medium text-slate-700">
                        <option value="5">5 問</option>
                        <option value="10" selected>10 問</option>
                        <option value="20">20 問</option>
                        <option value="all">指定範囲のすべての問題 (全意味)</option>
                    </select>
                </div>

                <button onclick="startTest()" class="w-full py-4 bg-primary bg-primary-hover text-white font-bold rounded-xl shadow-md transition-all text-center flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>テストを開始する</span>
                </button>
            </section>

            <!-- 3. テスト実行画面 -->
            <section id="view-testing" class="view-screen hidden flex-col h-full justify-between space-y-4">
                <!-- プログレス＆ヘッダー -->
                <div>
                    <div class="flex justify-between items-center text-sm font-semibold text-slate-500 mb-2">
                        <span>問題 <span id="current-q-num" class="text-slate-800 font-bold">1</span> / <span id="total-q-num">10</span></span>
                        <span id="question-timer" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-mono"><i class="fa-regular fa-clock mr-1"></i><span id="timer-sec">0.0</span>s</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                        <div id="test-progress-bar" class="bg-primary h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>

                <!-- 設問カード -->
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 text-center space-y-3 flex-1 flex flex-col justify-center items-center">
                    <div class="flex items-center space-x-2">
                        <span id="test-prompt-type" class="text-xs font-bold px-3 py-1 rounded-full bg-slate-200 text-slate-600">英単語</span>
                        <span id="test-prompt-num" class="text-xs font-bold px-2.5 py-1 rounded-full bg-primary-light text-primary border border-primary/20">No.1 (意味①)</span>
                    </div>
                    <h3 id="test-prompt-main" class="text-3xl font-extrabold text-slate-800 tracking-wide my-2">word</h3>
                    <p id="test-prompt-sub" class="text-sm text-slate-600 bg-white p-3 rounded-lg border border-slate-200 w-full max-w-md hidden">
                        例文がここに入ります。
                    </p>
                </div>

                <!-- 解答選択肢 (四択) & 決定ボタン -->
                <div id="choice-section" class="space-y-3">
                    <div id="choice-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <!-- JSで動的にボタン生成 -->
                    </div>
                    <button id="choice-submit-btn" onclick="submitChoiceAnswer()" disabled class="w-full py-3.5 bg-slate-200 text-slate-400 font-bold rounded-xl shadow-none transition-all cursor-not-allowed flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-check"></i>
                        <span>回答を決定する</span>
                    </button>
                </div>

                <!-- 入力フォーム (タイピング形式) -->
                <div id="typing-container" class="hidden space-y-3">
                    <input type="text" id="typing-input" placeholder="英単語を入力してください..." autocomplete="off" class="w-full p-4 rounded-xl border-2 border-slate-300 focus-ring font-medium text-lg text-center">
                    <button onclick="submitTypingAnswer()" class="w-full py-3 bg-primary bg-primary-hover text-white font-bold rounded-xl shadow transition-all">
                        回答する
                    </button>
                </div>
            </section>

            <!-- 4. テスト結果画面 -->
            <section id="view-test-result" class="view-screen hidden text-center space-y-6 py-4">
                <div class="space-y-2">
                    <div class="inline-flex items-center justify-center w-20 h-20 bg-amber-100 text-amber-500 rounded-full text-4xl mb-2">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">テスト結果</h2>
                    <p class="text-slate-500 text-sm">お疲れ様でした！結果は以下の通りです。</p>
                </div>

                <!-- スコアカード -->
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 grid grid-cols-2 gap-4">
                    <div class="p-4 bg-white rounded-xl shadow-sm border border-slate-100">
                        <span class="text-xs text-slate-400 font-bold block mb-1">正答数</span>
                        <span class="text-3xl font-extrabold text-slate-800"><span id="result-score" class="text-primary">0</span> / <span id="result-total">0</span></span>
                    </div>
                    <div class="p-4 bg-white rounded-xl shadow-sm border border-slate-100">
                        <span class="text-xs text-slate-400 font-bold block mb-1">正答率</span>
                        <span id="result-accuracy" class="text-3xl font-extrabold text-emerald-600">0%</span>
                    </div>
                </div>

                <div class="flex space-x-3">
                    <button onclick="switchView('menu')" class="flex-1 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition-all">
                        メニューへ戻る
                    </button>
                    <button onclick="showLatestHistoryDetail()" class="flex-1 py-3 bg-primary bg-primary-hover text-white font-bold rounded-xl shadow transition-all">
                        詳細を確認する
                    </button>
                </div>
            </section>

            <!-- 5. 単語一覧画面 -->
            <section id="view-word-list" class="view-screen hidden space-y-4 flex-1 flex flex-col">
                <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                    <div class="flex items-center space-x-3">
                        <button onclick="switchView('menu')" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100">
                            <i class="fa-solid fa-arrow-left text-lg"></i>
                        </button>
                        <h2 class="text-xl font-bold text-slate-800">単語一覧</h2>
                    </div>
                    <!-- 検索バー -->
                    <div class="relative w-36 sm:w-48">
                        <input type="text" id="word-search-input" oninput="renderWordList()" placeholder="検索..." class="w-full pl-8 pr-3 py-1.5 rounded-lg border border-slate-300 text-xs focus-ring">
                        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
                    </div>
                </div>

                <div id="word-cards-container" class="space-y-3 overflow-y-auto flex-1 pr-1 max-h-[460px]">
                    <!-- 動的挿入 -->
                </div>
            </section>

            <!-- 6. 履歴画面 -->
            <section id="view-history" class="view-screen hidden space-y-4">
                <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                    <div class="flex items-center space-x-3">
                        <button onclick="switchView('menu')" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100">
                            <i class="fa-solid fa-arrow-left text-lg"></i>
                        </button>
                        <h2 class="text-xl font-bold text-slate-800">テスト履歴 (直近10回)</h2>
                    </div>
                </div>

                <div id="history-list-container" class="space-y-3">
                    <!-- 動的挿入 -->
                </div>
            </section>

            <!-- 7. 設定画面 -->
            <section id="view-settings" class="view-screen hidden space-y-6">
                <div class="flex items-center space-x-3 border-b border-slate-200 pb-3">
                    <button onclick="switchView('menu')" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100">
                        <i class="fa-solid fa-arrow-left text-lg"></i>
                    </button>
                    <h2 class="text-xl font-bold text-slate-800">設定</h2>
                </div>

                <!-- フォント指定 -->
                <div class="space-y-2">
                    <label class="block font-bold text-slate-700 text-sm">文字のフォント</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="setFontFamily('sans')" class="p-3 rounded-xl border border-slate-200 text-xs font-sans hover:bg-slate-50">ゴシック体 (Sans)</button>
                        <button onclick="setFontFamily('serif')" class="p-3 rounded-xl border border-slate-200 text-xs font-serif-custom hover:bg-slate-50">明朝体 (Serif)</button>
                        <button onclick="setFontFamily('mono')" class="p-3 rounded-xl border border-slate-200 text-xs font-mono-custom hover:bg-slate-50">等幅 (Mono)</button>
                    </div>
                </div>

                <!-- 履歴の削除 -->
                <div class="pt-4 border-t border-slate-200">
                    <button onclick="openConfirmModal('学習履歴をすべて削除しますか？', clearHistory)" class="w-full py-3 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl transition-all border border-red-200 flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>テスト履歴を削除する</span>
                    </button>
                </div>
            </section>

        </main>
    </div>

    <!-- 履歴詳細表示用モーダル -->
    <div id="modal-history-detail" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                <h3 class="font-bold text-base"><i class="fa-solid fa-file-lines text-amber-400 mr-2"></i>テスト詳細結果</h3>
                <button onclick="closeModal('modal-history-detail')" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="modal-detail-content" class="p-4 overflow-y-auto space-y-3 flex-1 text-sm">
                <!-- 動的挿入 -->
            </div>
            <div class="p-3 bg-slate-50 border-t border-slate-200 text-right">
                <button onclick="closeModal('modal-history-detail')" class="px-5 py-2 bg-slate-700 text-white font-bold rounded-lg text-xs">閉じる</button>
            </div>
        </div>
    </div>

    <!-- カスタム確認モーダル（alert/confirm非使用） -->
    <div id="modal-confirm" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
            <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-xl mx-auto">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <p id="confirm-modal-msg" class="font-bold text-slate-800">実行しますか？</p>
            <div class="flex space-x-3">
                <button onclick="closeModal('modal-confirm')" class="flex-1 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">キャンセル</button>
                <button id="confirm-modal-ok-btn" class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs">実行する</button>
            </div>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        // 各単語と単語そのものの意味データ (No.1 〜 No.185)
        let wordList = [
            { id: 1, english: "run", meanings: [
                { senseNum: 1, japanese: "経営する", example: "run a big company", exampleJp: "大会社を経営する" }
            ]},
            { id: 2, english: "meet", meanings: [
                { senseNum: 1, japanese: "満たす", example: "meet people's needs", exampleJp: "人々の必要を満たす" },
                { senseNum: 2, japanese: "対処する", example: "how to meet the problem", exampleJp: "問題に対処する方法" }
            ]},
            { id: 3, english: "right", meanings: [
                { senseNum: 1, japanese: "権利", example: "the right to vote", exampleJp: "投票する権利" },
                { senseNum: 2, japanese: "善", example: "right and wrong", exampleJp: "善と悪" },

        function updateWordBadges() {

            document.getElementById('max-word-info').innerText = `${wordList.length} 語 / 全${totalMeanings}意味 (No.${minId} 〜 No.${maxId})`;

        // --- 単語確認画面 ---
        function renderWordList() {
            const container = document.getElementById('word-cards-container');
            const search = document.getElementById('word-search-input').value.toLowerCase().trim();
            container.innerHTML = '';

            const filtered = wordList.filter(w => 
                w.english.toLowerCase().includes(search) || 
                w.id.toString() === search ||
                w.meanings.some(m => m.japanese.includes(search))
            );

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">該当する単語が見つかりません。</div>`;
                return;
            }

            filtered.forEach(w => {

        // --- フラットな意味別問題リストの生成 ---
        function getFlatQuestionItems(startRange, endRange) {
            let questions = [];
            wordList.forEach(w => {
                if (w.id >= startRange && w.id <= endRange) {
                    w.meanings.forEach(m => {
                        questions.push({
                            questionId: `${w.id}-${m.senseNum}`,
                            wordId: w.id,
                            english: w.english,
                            senseNum: m.senseNum,
                            japanese: m.japanese,
                            example: m.example,
                            exampleJp: m.exampleJp
                        });
                    });
                }
            });
            return questions;
        }

        // --- テスト実行ロジック ---
        function startTest() {
            const mode = document.querySelector('input[name="testMode"]:checked').value;
            const startRange = parseInt(document.getElementById('range-start').value) || 1;
            const endRange = parseInt(document.getElementById('range-end').value) || wordList.length;
            const countVal = document.getElementById('test-count-select').value;

            // 範囲内のフラットな問題（意味単位）を取得
            let targetQuestions = getFlatQuestionItems(startRange, endRange);

            if (targetQuestions.length === 0) {
                openCustomModal('指定された範囲に該当する単語がありません。');
                return;
            }

            // シャッフル
            targetQuestions = shuffleArray([...targetQuestions]);

            // 出題数の決定
            let qCount = countVal === 'all' ? targetQuestions.length : parseInt(countVal);
            targetQuestions = targetQuestions.slice(0, Math.min(qCount, targetQuestions.length));

            currentTest = {
                mode: mode,
                questions: targetQuestions,
                currentIndex: 0,
                answers: [],
                qStartTime: 0,
                timerInterval: null
            };

            switchView('testing');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentTest.currentIndex >= currentTest.questions.length) {
                finishTest();
                return;
            }

            const q = currentTest.questions[currentTest.currentIndex];
            const total = currentTest.questions.length;
            const idx = currentTest.currentIndex + 1;

            document.getElementById('current-q-num').innerText = idx;
            document.getElementById('total-q-num').innerText = total;
            document.getElementById('test-progress-bar').style.width = `${(idx / total) * 100}%`;

            const promptType = document.getElementById('test-prompt-type');
            const promptNum = document.getElementById('test-prompt-num');
            const promptMain = document.getElementById('test-prompt-main');
            const promptSub = document.getElementById('test-prompt-sub');
            const choiceSection = document.getElementById('choice-section');
            const typingContainer = document.getElementById('typing-container');

            choiceSection.classList.add('hidden');
            typingContainer.classList.add('hidden');
            promptSub.classList.add('hidden');

            promptNum.innerText = `No.${q.wordId} (意味${q.senseNum})`;

            if (currentTest.mode === 'en-to-jp') {
                promptType.innerText = '英単語 → 日本語';
                promptMain.innerText = q.english;
                if (q.example) {
                    // 英文例文を表示し、対象の英単語を強調表示
                    const escapedExample = escapeHtml(q.example);
                    const regex = new RegExp(`(${escapeRegExp(q.english)})`, 'gi');
                    const highlightedExample = escapedExample.replace(regex, '<span class="underline font-bold text-primary">$1</span>');
                    promptSub.innerHTML = `<i class="fa-regular fa-file-lines text-primary mr-1"></i>${highlightedExample}`;
                    promptSub.classList.remove('hidden');
                }
                setupChoices(q, 'japanese');
            } else if (currentTest.mode === 'jp-to-en') {
                promptType.innerText = '日本語(+例文) → 英単語';
                promptMain.innerText = q.japanese;
                if (q.example) {
                    promptSub.innerHTML = `<i class="fa-regular fa-lightbulb text-amber-500 mr-1"></i>${escapeHtml(q.example.replace(new RegExp(q.english, 'gi'), '_____'))}<br><span class="text-xs text-slate-400">${escapeHtml(q.exampleJp || '')}</span>`;
                    promptSub.classList.remove('hidden');
                }
                setupChoices(q, 'english');
            } else if (currentTest.mode === 'typing') {
                promptType.innerText = 'キーボード入力 (スペル)';
                promptMain.innerText = q.japanese;
                if (q.example) {
                    promptSub.innerHTML = `<i class="fa-regular fa-lightbulb text-amber-500 mr-1"></i>${escapeHtml(q.example.replace(new RegExp(q.english, 'gi'), '_____'))}<br><span class="text-xs text-slate-400">${escapeHtml(q.exampleJp || '')}</span>`;
                    promptSub.classList.remove('hidden');
                }
                typingContainer.classList.remove('hidden');
                const typingInput = document.getElementById('typing-input');
                typingInput.value = '';
                setTimeout(() => typingInput.focus(), 100);
            }

            // タイマーリセット
            startQuestionTimer();
        }

        // タイマー開始
        function startQuestionTimer() {
            clearInterval(currentTest.timerInterval);
            currentTest.qStartTime = Date.now();
            const timerEl = document.getElementById('timer-sec');
            timerEl.innerText = '0.0';

            currentTest.timerInterval = setInterval(() => {
                const elapsed = (Date.now() - currentTest.qStartTime) / 1000;
                timerEl.innerText = elapsed.toFixed(1);
            }, 100);
        }

        // 4択選択肢の作成（意味別）
        function setupChoices(correctQ, targetKey) {
            currentTest.targetKey = targetKey;
            currentTest.selectedChoice = null;

            const choiceContainer = document.getElementById('choice-container');
            const submitBtn = document.getElementById('choice-submit-btn');
            
            document.getElementById('choice-section').classList.remove('hidden');
            choiceContainer.innerHTML = '';

            // 決定ボタンの初期化（選択前は無効化）
            submitBtn.disabled = true;
            submitBtn.className = 'w-full py-3.5 bg-slate-200 text-slate-400 font-bold rounded-xl shadow-none transition-all cursor-not-allowed flex items-center justify-center space-x-2';

            // 全ての問題アイテムを取得してダミー選択肢をプール
            let allItems = getFlatQuestionItems(1, 1000);
            
            // 正解と同一の正解テキストを持つものは除く
            let dummyPool = allItems.filter(item => item[targetKey] !== correctQ[targetKey]);
            dummyPool = shuffleArray(dummyPool);

            // ユニークな解答肢を作成
            let selectedDummies = [];
            let usedTexts = new Set([correctQ[targetKey]]);

            for (let dummy of dummyPool) {
                if (!usedTexts.has(dummy[targetKey])) {
                    usedTexts.add(dummy[targetKey]);
                    selectedDummies.push(dummy);
                }
                if (selectedDummies.length >= 3) break;
            }

            let options = [correctQ, ...selectedDummies];
            options = shuffleArray(options);

            options.forEach(opt => {
                const val = opt[targetKey];
                const btn = document.createElement('button');
                btn.className = 'choice-btn p-4 bg-white border-2 border-slate-200 hover:border-slate-300 rounded-xl font-bold text-slate-800 transition-all text-left flex justify-between items-center shadow-sm';
                btn.innerHTML = `<span>${escapeHtml(val)}</span> <i class="fa-regular fa-circle text-slate-300 choice-icon"></i>`;
                btn.onclick = () => selectChoice(btn, val);
                choiceContainer.appendChild(btn);
            });
        }

        // 選択肢をタップした時の選択処理
        function selectChoice(selectedBtn, val) {
            currentTest.selectedChoice = val;

            // 全選択肢のスタイルをリセット
            document.querySelectorAll('.choice-btn').forEach(btn => {
                btn.className = 'choice-btn p-4 bg-white border-2 border-slate-200 hover:border-slate-300 rounded-xl font-bold text-slate-800 transition-all text-left flex justify-between items-center shadow-sm';
                const icon = btn.querySelector('.choice-icon');
                if (icon) icon.className = 'fa-regular fa-circle text-slate-300 choice-icon';
            });

            // 選択された選択肢をハイライト
            selectedBtn.className = 'choice-btn p-4 bg-primary-light border-2 border-primary rounded-xl font-bold text-slate-900 transition-all text-left flex justify-between items-center shadow-md';
            const icon = selectedBtn.querySelector('.choice-icon');
            if (icon) icon.className = 'fa-solid fa-circle-check text-primary choice-icon text-lg';

            // 決定ボタンを有効化
            const submitBtn = document.getElementById('choice-submit-btn');
            submitBtn.disabled = false;
            submitBtn.className = 'w-full py-3.5 bg-primary bg-primary-hover text-white font-bold rounded-xl shadow-md transition-all cursor-pointer flex items-center justify-center space-x-2';
        }

        // 決定ボタン押下時の解答チェック
        function submitChoiceAnswer() {
            if (!currentTest.selectedChoice) return;
            const q = currentTest.questions[currentTest.currentIndex];
            const targetKey = currentTest.targetKey;
            const isCorrect = currentTest.selectedChoice === q[targetKey];
            recordAnswer(isCorrect, currentTest.selectedChoice);
        }

        // タイピング形式の回答チェック
        function submitTypingAnswer() {
            const q = currentTest.questions[currentTest.currentIndex];
            const inputVal = document.getElementById('typing-input').value.trim();
            const isCorrect = inputVal.toLowerCase() === q.english.toLowerCase();
            recordAnswer(isCorrect, inputVal);
        }

        // タイピング時にEnterキーで送信
        document.getElementById('typing-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitTypingAnswer();
            }
        });

        // 解答の記録
        function recordAnswer(isCorrect, userChoice) {
            clearInterval(currentTest.timerInterval);
            const timeSpent = ((Date.now() - currentTest.qStartTime) / 1000).toFixed(1);

            currentTest.answers.push({
                question: currentTest.questions[currentTest.currentIndex],
                userAnswer: userChoice || '(無回答)',
                isCorrect: isCorrect,
                timeSpent: parseFloat(timeSpent)
            });

            currentTest.currentIndex++;
            loadNextQuestion();
        }

        // テスト終了処理
        function finishTest() {
            clearInterval(currentTest.timerInterval);
            
            const correctCount = currentTest.answers.filter(a => a.isCorrect).length;
            const totalCount = currentTest.answers.length;
            const accuracy = Math.round((correctCount / totalCount) * 100);

            // 履歴オブジェクト構築
            const historyItem = {
                id: Date.now(),
                date: new Date().toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                mode: currentTest.mode,
                correctCount: correctCount,
                totalCount: totalCount,
                accuracy: accuracy,
                details: currentTest.answers
            };

            // 直近10件に制限して保存
            testHistory.unshift(historyItem);
            if (testHistory.length > 10) {
                testHistory.pop();
            }

            // 結果画面のUI書き換え
            document.getElementById('result-score').innerText = correctCount;
            document.getElementById('result-total').innerText = totalCount;
            document.getElementById('result-accuracy').innerText = `${accuracy}%`;

            switchView('test-result');
        }

        // 最新のテスト詳細を表示
        function showLatestHistoryDetail() {
            if (testHistory.length > 0) {
                showHistoryDetail(0);
            }
        }

        // --- 履歴一覧画面 ---
        function renderHistoryList() {
            const container = document.getElementById('history-list-container');
            container.innerHTML = '';

            if (testHistory.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 space-y-2">
                        <i class="fa-solid fa-clock-rotate-left text-3xl mb-1 block"></i>
                        <p class="text-sm">テスト履歴がまだありません。</p>
                    </div>`;
                return;
            }

            testHistory.forEach((h, index) => {
                const modeLabel = h.mode === 'en-to-jp' ? '英→日 四択' : h.mode === 'jp-to-en' ? '日→英 四択' : '英単語入力';
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between hover:border-slate-300 transition-all cursor-pointer';
                card.onclick = () => showHistoryDetail(index);

                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">${modeLabel}</span>
                            <span class="text-xs text-slate-400">${h.date}</span>
                        </div>
                        <div class="text-sm font-bold text-slate-800">
                            正解: <span class="text-primary">${h.correctCount}</span> / ${h.totalCount} 問
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="text-right">
                            <span class="text-lg font-extrabold ${h.accuracy >= 80 ? 'text-emerald-600' : h.accuracy >= 50 ? 'text-amber-600' : 'text-red-500'}">${h.accuracy}%</span>
                            <span class="block text-[10px] text-slate-400">正答率</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 履歴詳細モーダルの表示
        function showHistoryDetail(index) {
            const item = testHistory[index];
            if (!item) return;

            const content = document.getElementById('modal-detail-content');
            content.innerHTML = '';

            item.details.forEach((d, i) => {
                const detailCard = document.createElement('div');
                detailCard.className = `p-3 rounded-xl border ${d.isCorrect ? 'bg-emerald-50/40 border-emerald-200' : 'bg-rose-50/40 border-rose-200'} space-y-1.5`;

                detailCard.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center space-x-2">
                            <span class="w-5 h-5 rounded-full ${d.isCorrect ? 'bg-emerald-500' : 'bg-rose-500'} text-white text-[10px] font-bold flex items-center justify-center">${i + 1}</span>
                            <span class="font-bold text-slate-800">${escapeHtml(d.question.english)}</span>
                            <span class="text-xs font-semibold text-slate-500">(No.${d.question.wordId} 意味${d.question.senseNum}: ${escapeHtml(d.question.japanese)})</span>
                        </div>
                        <span class="text-[11px] text-slate-400 font-mono"><i class="fa-regular fa-clock mr-1"></i>${d.timeSpent}s</span>
                    </div>
                    <div class="text-xs space-y-0.5 pt-1 border-t border-slate-100">
                        <p class="text-slate-600">あなたの回答: <span class="font-bold ${d.isCorrect ? 'text-emerald-700' : 'text-rose-700'}">${escapeHtml(d.userAnswer)}</span></p>
                        ${!d.isCorrect ? `<p class="text-slate-500">正解: <span class="font-bold text-slate-800">${escapeHtml(item.mode === 'en-to-jp' ? d.question.japanese : d.question.english)}</span></p>` : ''}
                    </div>
                `;
                content.appendChild(detailCard);
            });

            document.getElementById('modal-history-detail').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // --- 設定管理 ---
        function setFontFamily(font) {
            appState.fontFamily = font;
            document.body.classList.remove('font-sans-custom', 'font-serif-custom', 'font-mono-custom');
            if (font === 'sans') document.body.classList.add('font-sans-custom');
            if (font === 'serif') document.body.classList.add('font-serif-custom');
            if (font === 'mono') document.body.classList.add('font-mono-custom');
        }

        function applySettings() {
            setFontFamily(appState.fontFamily);
        }

        function clearHistory() {
            testHistory = [];
            renderHistoryList();
            closeModal('modal-confirm');
        }

        // --- カスタムダイアログ/モーダル ---
        function openCustomModal(msg) {
            document.getElementById('confirm-modal-msg').innerText = msg;
            document.getElementById('confirm-modal-ok-btn').style.display = 'none';
            document.getElementById('modal-confirm').classList.remove('hidden');
        }

        function openConfirmModal(msg, onOk) {
            document.getElementById('confirm-modal-msg').innerText = msg;
            const okBtn = document.getElementById('confirm-modal-ok-btn');
            okBtn.style.display = 'block';
            okBtn.onclick = onOk;
            document.getElementById('modal-confirm').classList.remove('hidden');
        }

        // ユーティリティ: シャッフル
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // エスケープ処理
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 正規表現用エスケープ関数
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
    </script>
</body>
